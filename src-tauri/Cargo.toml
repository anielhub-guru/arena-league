[package]
name = "dominion-league-manager"
version = "0.6.0"
description = "Offline text-only 5v5 dominion league management game"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "dominion_league_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
