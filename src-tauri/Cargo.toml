[package]
name = "arena-league-manager"
version = "0.2.0"
description = "Offline text-only 5v5 arena league management game"
edition = "2021"

[lib]
name = "arena_league_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
